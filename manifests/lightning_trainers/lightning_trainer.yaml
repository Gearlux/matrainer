description: "PyTorch Lightning Trainer — top-level training loop driver."
use_case: "Wrap inside the Marainer Trainer's lightning: field. Controls device, epoch count, callbacks, and logging cadence."
category: "Generic"
flux_type: "LightningTrainer"
class_path: "pytorch_lightning.Trainer"
params:
  max_epochs:
    type: "int"
    default: 10
    description: "Maximum training epochs."
  accelerator:
    type: "str"
    default: "auto"
    choices: ["auto", "cpu", "gpu", "mps", "tpu"]
    description: "Device family. 'auto' picks the best available."
  devices:
    type: "int | str | List[int]"
    default: 1
    description: "Number of devices, 'auto', or explicit indices like [0, 1]."
  log_every_n_steps:
    type: "int"
    default: 50
    description: "Logging cadence (in optimizer steps)."
  callbacks:
    type: "List[pytorch_lightning.Callback] | null"
    default: null
    description: "Optional list of callbacks (ModelCheckpoint, EarlyStopping, ...)."
  precision:
    type: "str | int"
    default: "32-true"
    description: "Mixed-precision: '32-true', '16-mixed', 'bf16-mixed', '64-true', etc."
  gradient_clip_val:
    type: "float | null"
    default: null
    description: "Optional gradient L2-norm clip threshold."
  enable_progress_bar:
    type: "bool"
    default: true
    description: "Show the per-epoch progress bar."
