description: "Marainer Evaluator: run a (pre-loaded) model over a dataset, log metrics, optionally persist predictions."
use_case: "Top-level evaluator object for any task. The model is responsible for its own weight loading — pass checkpoint_path to the model class, not to this Evaluator. Pair with a metrics_sidecar_path if you want a logger-agnostic JSON dump of the final metric values for downstream tooling."
category: "Generic"
flux_type: "Evaluator"
class_path: "marainer.evaluator.Evaluator"
params:
  model:
    type: "torch.nn.Module"
    required: true
    description: "The neural network (deferred via Confluid). Should arrive ALREADY weight-loaded."
  dataset:
    type: "Any"
    required: true
    description: "Evaluation dataset or Flux pipeline (deferred)."
  loader:
    type: "Lazy[DataLoader]"
    default: "Class(DataLoader)"
    description: "DataLoader config (deferred). Supply a matching collate_fn for tasks that need one."
  metrics:
    type: "torchmetrics.MetricCollection | null"
    default: null
    description: "Optional MetricCollection or adapter that understands the model's step output."
  predictions_sink:
    type: "Any | null"
    default: null
    description: "Optional duck-typed sink with .write(prediction, metadata) and .close()."
  lightning:
    type: "Lazy[pytorch_lightning.Trainer]"
    default: "Class(L.Trainer)"
    description: "PyTorch Lightning Trainer config (only test() is invoked)."
  experiment_name:
    type: "str"
    default: "marainer_eval"
    description: "Metadata for loggers."
  run_name:
    type: "str"
    default: "evaluate"
    description: "Metadata for loggers."
  loggers:
    type: "List[pytorch_lightning.loggers.Logger] | null"
    default: null
    description: "Optional list of Lightning loggers."
  metrics_sidecar_path:
    type: "str | null"
    default: null
    description: "Optional path. When set, the final metrics.compute() dict is dumped as JSON after the test loop. Logger-agnostic — works regardless of which Lightning logger you wired."
