description: "torch.nn.CrossEntropyLoss — multi-class classification loss."
use_case: "Default classification loss. The Marainer Trainer uses this by default if no loss_fn is configured."
category: "Generic"
flux_type: "Loss"
task: "classification"
class_path: "torch.nn.CrossEntropyLoss"
params:
  weight:
    type: "List[float] | null"
    default: null
    description: "Optional per-class weight tensor (rebalances imbalanced classes)."
  ignore_index:
    type: "int"
    default: -100
    description: "Target value to ignore in the loss computation."
  reduction:
    type: "str"
    default: "mean"
    choices: ["mean", "sum", "none"]
    description: "How to reduce per-sample losses to a scalar."
  label_smoothing:
    type: "float"
    default: 0.0
    description: "Label-smoothing epsilon (0 = no smoothing)."
