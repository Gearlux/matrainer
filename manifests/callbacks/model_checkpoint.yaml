description: "Lightning ModelCheckpoint callback — save best-and-last weights based on a monitored metric."
use_case: "Wire under the Lightning Trainer's callbacks list to keep the K best checkpoints by val/loss (or any logged scalar). Common config: monitor='val/loss', mode='min', save_top_k=3, save_last=true."
category: "Generic"
flux_type: "Callback"
class_path: "pytorch_lightning.callbacks.ModelCheckpoint"
params:
  dirpath:
    type: "str | null"
    default: null
    description: "Directory to save checkpoints. Default uses Lightning's resolved log dir."
  filename:
    type: "str | null"
    default: null
    description: "Filename template (e.g. 'epoch{epoch:03d}-valloss{val/loss:.4f}')."
  monitor:
    type: "str | null"
    default: null
    description: "Logged scalar to track (e.g. 'val/loss')."
  mode:
    type: "str"
    default: "min"
    choices: ["min", "max"]
    description: "Whether lower or higher monitor values are better."
  save_top_k:
    type: "int"
    default: 1
    description: "Keep the top-K checkpoints. -1 keeps every checkpoint."
  save_last:
    type: "bool"
    default: false
    description: "Always save a 'last.ckpt' alongside the top-K."
  every_n_epochs:
    type: "int"
    default: 1
    description: "How often to checkpoint (in epochs)."
  auto_insert_metric_name:
    type: "bool"
    default: true
    description: "Whether Lightning auto-prefixes the monitor name in the filename."
