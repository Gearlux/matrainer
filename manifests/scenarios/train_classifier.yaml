flux_type: Scenario
scenario: train_classifier
verb: train
target: marainer
description: |
  Generic single-model classification training scenario. Plug in any
  classification model class + train/val dataset classes + a class count;
  the template wires them through a standard AdamW + CE-loss + MetricCollection
  pipeline that calls `marainer train`. Domain-specific tweaks (HuggingFace
  source, custom collates, etc.) belong in a domain scenario; this one is
  for quickly bootstrapping a baseline.
classes:
  model: marainer.trainer.Trainer
slots:
  run_name:
    type: str
    required: true
    prompt: "Short run name for checkpoint dir + MLflow run?"
    validation: "matches:^[a-zA-Z0-9_-]+$"
  experiment_name:
    type: str
    required: true
    prompt: "MLflow experiment name?"
  model_class:
    type: str
    required: true
    prompt: "Dotted class_path of the classification model (e.g. sonair.timm_classifier.TimmClassifierModel)?"
  train_dataset_class:
    type: str
    required: true
    prompt: "Dotted class_path of the training dataset?"
  val_dataset_class:
    type: str
    required: true
    prompt: "Dotted class_path of the validation dataset?"
  num_classes:
    type: int
    required: true
    prompt: "Number of output classes?"
    validation: ">= 2"
  batch_size:
    type: int
    default: 32
    validation: ">= 1"
  num_workers:
    type: int
    default: 4
    validation: ">= 0"
  max_epochs:
    type: int
    default: 10
    validation: ">= 1"
  lr:
    type: float
    default: 0.0001
  weight_decay:
    type: float
    default: 0.01
  label_smoothing:
    type: float
    default: 0.0
    validation: ">= 0"
template: |
  num_classes: {{ num_classes }}

  train_set: !class:{{ train_dataset_class }}

  val_set: !class:{{ val_dataset_class }}

  model: !class:{{ model_class }}
    num_classes: !ref:num_classes

  loss_fn: !class:torch.nn.CrossEntropyLoss
    label_smoothing: {{ label_smoothing }}

  val_metrics: !class:torchmetrics.MetricCollection
    metrics:
      top1: !class:torchmetrics.classification.MulticlassAccuracy
        num_classes: !ref:num_classes
        top_k: 1
      f1_macro: !class:torchmetrics.classification.MulticlassF1Score
        num_classes: !ref:num_classes
        average: macro
    prefix: "val/"

  train_loader: !class:torch.utils.data.DataLoader
    batch_size: {{ batch_size }}
    shuffle: true
    num_workers: {{ num_workers }}
    persistent_workers: true

  val_loader: !class:torch.utils.data.DataLoader
    batch_size: {{ batch_size }}
    shuffle: false
    num_workers: {{ num_workers }}
    persistent_workers: true

  optimizer: !class:torch.optim.AdamW
    lr: {{ lr }}
    weight_decay: {{ weight_decay }}

  lightning: !class:pytorch_lightning.Trainer
    max_epochs: {{ max_epochs }}
    accelerator: auto
    devices: 1
    log_every_n_steps: 10

  trainer: !class:marainer.trainer.Trainer
    experiment_name: {{ experiment_name }}
    run_name: {{ run_name }}
    model: !ref:model
    train_set: !ref:train_set
    val_set: !ref:val_set
    train_loader: !ref:train_loader
    val_loader: !ref:val_loader
    loss_fn: !ref:loss_fn
    val_metrics: !ref:val_metrics
    optimizer: !ref:optimizer
    lightning: !ref:lightning
