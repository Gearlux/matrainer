description: "AdamW optimizer (decoupled weight decay)."
use_case: "Default for transformer training and Ultralytics' YOLO/RT-DETR recipes. Decouples weight decay from the gradient step, fixing the L2-regularization-coupling pathology in classic Adam."
category: "Generic"
flux_type: "Optimizer"
class_path: "torch.optim.AdamW"
params:
  lr:
    type: "float"
    default: 0.001
    description: "Learning rate."
  betas:
    type: "Tuple[float, float]"
    default: [0.9, 0.999]
    description: "Coefficients for running averages."
  eps:
    type: "float"
    default: 1.0e-8
    description: "Numerical stability term."
  weight_decay:
    type: "float"
    default: 0.01
    description: "Decoupled weight decay coefficient."
  amsgrad:
    type: "bool"
    default: false
    description: "Use AMSGrad variant."
