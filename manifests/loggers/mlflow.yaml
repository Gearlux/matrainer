description: "PyTorch Lightning MLflow logger."
use_case: "Tracks runs against an MLflow tracking server (or local mlruns/ dir). Pair with an aisland-managed MLflow service for cross-machine run comparison."
category: "Generic"
flux_type: "Logger"
class_path: "pytorch_lightning.loggers.MLFlowLogger"
metric_source: "mlflow"
params:
  experiment_name:
    type: "str"
    default: "lightning_logs"
    description: "MLflow experiment name."
  run_name:
    type: "str | null"
    default: null
    description: "Optional MLflow run name."
  tracking_uri:
    type: "str | null"
    default: null
    description: "MLflow tracking URI (e.g. 'http://localhost:5000', or 'file:./mlruns')."
  tags:
    type: "Dict[str, Any] | null"
    default: null
    description: "Optional dict of MLflow run tags."
  log_model:
    type: "bool | str"
    default: false
    description: "Whether to log the model checkpoint to MLflow ('all' = every checkpoint)."
