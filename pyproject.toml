[project]
name = "marainer"
version = "0.1.0"
description = "Project-agnostic training and processing pipeline orchestrator."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "liquifai>=0.1.0",
    "log-flow>=0.1.0",
    "confluid>=0.1.0",
    "data-flux>=0.1.0",
    "mlflow",
    "torch",
    "numpy",
    "pytorch-lightning",
    "tensorboard",
    "torchmetrics",
    "tabulate",
    "matplotlib",
    "psutil",
    # rich powers DatasetProcessor's optional progress bar (marainer.processing).
    "rich",
    # pyobjc subset for the inline IOAccelerator reader (Apple-Silicon GPU
    # utilisation, no sudo) in marainer.system_metrics. The full ``pyobjc``
    # meta-package pulls in 100+ frameworks; these two are the minimum
    # surface our reader uses. ``pyobjc-framework-Cocoa`` ships both the
    # Foundation module (for ``NSBundle.bundleWithIdentifier_``) and the
    # CoreFoundation module (for ``CFRelease`` on the props dict).
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
torpaido = [
    "torpaido>=0.1.0"
]

[project.scripts]
marainer = "marainer.cli:main"

[project.entry-points."confluid.configurables"]
marainer = "marainer"
# Exposes ClassificationPredictionsSink (modality-neutral Evaluator predictions
# sink) to confluid/navigaitor/FluxStudio discovery.
marainer-sinks = "marainer.sinks"
# Exposes DatasetProcessor (the generic process/download/convert pipeline runner)
# to confluid/navigaitor discovery. Moved here from waivefront.processing.
marainer-processing = "marainer.processing"

[tool.setuptools.packages.find]
where = ["."]
include = ["marainer*"]

[tool.setuptools.package-data]
marainer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["marainer"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "torch.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "tabulate.*",
    "matplotlib.*"
]
ignore_missing_imports = true
