[project]
name = "marainer"
version = "0.1.0"
description = "Experiment tracking for any training platform (MLflow / TensorBoard / CSV / W&B)."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
# LIGHT core: only the tracking library + framework-neutral checkpoint policies. The heavy
# training frameworks (torch / pytorch-lightning / tensorflow) and the logger libraries live
# behind the extras below; each backend imports its library lazily (marainer._imports.require).
dependencies = [
    "liquifai>=0.1.0",
    "loggair>=0.1.0",
    "confluid>=0.1.0",
    "recordstream>=0.1.0",
    "numpy",
    # coolname generates the default random run names (e.g. ``train_funny_rabbit``) in
    # marainer.run_names — offline adjective_noun slugs, no network.
    "coolname",
    # marainer.tracking.manifest writes the run manifest as YAML (the readable artifact)
    # beside its JSON twin. Declared explicitly rather than leaned on transitively via
    # confluid: a module that imports a package must depend on it.
    "pyyaml>=6.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
# Torch-only, Lightning-free helpers (marainer.torch: checkpoint + the metric helpers).
# torchmetrics is here rather than in [lightning] since 2026-08-01: `marainer.torch.metrics`
# builds `MetricCollection`s and never touches pytorch_lightning, so a consumer training on
# plain torch needs it — see marainer/torch/metrics.py.
torch = ["torch", "torchmetrics"]
# PyTorch-Lightning tracking helpers (marainer.lightning: TrackingCallback / TrackerLogger + metric utils).
lightning = ["marainer[torch]", "pytorch-lightning", "torchmetrics", "tabulate", "matplotlib"]
# Rendering a non-scalar run value (a confusion matrix) as a FIGURE for `Tracker.log_figure`.
# The markdown-table form needs no extra beyond `tabulate`; only the heatmap needs matplotlib,
# which is why it is opt-in — see marainer/tracking/render.py::render_matrix_as_figure.
plot = ["matplotlib"]
# The MlflowTracker backend + MLflow system metrics. pyobjc powers the inline IOAccelerator
# reader (Apple-Silicon GPU utilisation, no sudo) in marainer.tracking.system.
mlflow = [
    "mlflow",
    "psutil",
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]
# The TensorBoardTracker backend uses torch.utils.tensorboard, so it implies [torch].
tensorboard = ["marainer[torch]"]
# The WandbTracker backend.
wandb = ["wandb"]
# The AimTracker backend. Aim is Apache-2.0 and fully self-hosted — runs land in a local
# .aim repository and `aim up` serves the UI from it, with no server and no account.
aim = ["aim>=3.29"]
# The ClearMLTracker backend. Apache-2.0 with a self-hostable server (docker-compose);
# `offline=True` records to local disk with no server and no credentials at all.
clearml = ["clearml>=2.0"]
# Keras tracking helper (marainer.keras.keras_tracking_callback). Keras 3 is standalone and
# picks its own compute backend (torch / tensorflow / jax) via KERAS_BACKEND, so this extra
# must NOT drag TensorFlow in — a consumer on the torch backend never asked for it.
# `recordstream[keras]` is declared because the callback imports keras THROUGH
# `recordstream.keras`, which sets KERAS_BACKEND before keras loads (that extra adds only the
# same `keras` named above; recordstream itself is already a hard dependency).
keras = ["keras>=3.0", "recordstream[keras]>=0.1.0"]
# Only for a consumer that genuinely wants the TensorFlow ENGINE underneath Keras 3.
tensorflow = ["marainer[keras]", "tensorflow>=2.16"]
# Everything a workspace install wants.
all = ["marainer[lightning,mlflow,tensorboard,wandb,aim,clearml,keras,plot]"]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
torpaido = [
    "torpaido>=0.1.0"
]

[project.entry-points."confluid.configurables"]
# Light root: the tracking backends, run-name helper, and checkpoint policies.
marainer = "marainer"
# The four Tracker backends + TrackerGroup (import-safe; each lazily imports its library).
marainer-tracking = "marainer.tracking"
# (The predictions sink moved to recordstream 2026-07-29 — see `recordstream.predictions`, which
# recordstream discovers through its own entry point; there is no marainer-sinks group any more.)
# The Lightning platform: registers the deferred runtime members (torch optimizers / DataLoader /
# pl.Trainer) + stock Lightning loggers, and re-exports the tracking callbacks / MetricPreset. Imports
# pytorch_lightning — discovery must warn-and-continue on a light install without the [lightning] extra.
marainer-lightning = "marainer.lightning.configurables"

# Which of this project's extras belong to each aisland selection axis. Selecting a name here
# is what makes `aisland setup` add the matching extra to this project's install.
#
# TWO SIBLING AXES, deliberately never merged: `frameworks` is what a machine TRAINS WITH,
# `trackers` is where its results GO. They are unrelated choices, and folding the backends into
# `frameworks` would install a tracking client because someone picked a training engine.
#
# `frameworks` lists the per-framework TRACKING helpers (marainer.lightning / .keras).
# `trackers` lists the Tracker backends; `CsvTracker` is absent on purpose — it is stdlib-only,
# always available, and has no extra to select.
[tool.aisland]
frameworks = ["torch", "lightning", "keras", "tensorflow"]
trackers = ["mlflow", "tensorboard", "aim", "clearml", "wandb"]

[tool.setuptools.packages.find]
where = ["."]
include = ["marainer*"]

[tool.setuptools.package-data]
marainer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["marainer"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "torch.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "tabulate.*",
    "matplotlib.*",
    "wandb.*",
    "tensorflow.*",
    "coolname.*"
]
ignore_missing_imports = true
