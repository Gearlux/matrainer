[project]
name = "marainer"
version = "0.1.0"
description = "Project-agnostic training and processing pipeline orchestrator."
authors = [{name = "gearlux"}]
license = {text = "MIT"}
dependencies = [
    "liquify",
    "logflow",
    "confluid",
    "dataflux",
    "mlflow",
    "torch",
    "numpy",
    "pytorch-lightning"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
torpedo = [
    "torpedo"
]

[project.scripts]
marainer = "marainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["marainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["marainer"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "torch.*"
]
ignore_missing_imports = true
