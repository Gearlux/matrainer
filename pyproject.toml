[project]
name = "marainer"
version = "0.2.0"
description = "Experiment tracking for any training platform (MLflow / TensorBoard / CSV / W&B)."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
# LIGHT core: only the tracking library + framework-neutral checkpoint policies. The heavy
# training frameworks (torch / pytorch-lightning / tensorflow) and the logger libraries live
# behind the extras below; each backend imports its library lazily (marainer._imports.require).
dependencies = [
    "liquifai>=0.1.0",
    "loggair>=0.1.0",
    "confluid>=0.1.0",
    "sampleflux>=0.1.0",
    "numpy",
    # coolname generates the default random run names (e.g. ``train_funny_rabbit``) in
    # marainer.run_names — offline adjective_noun slugs, no network.
    "coolname",
]
requires-python = ">=3.12"

[project.optional-dependencies]
# Torch-only, Lightning-free helpers (marainer.torch: checkpoint / collate / output contracts).
torch = ["torch"]
# PyTorch-Lightning tracking helpers (marainer.lightning: TrackingCallback / TrackerLogger + metric utils).
lightning = ["marainer[torch]", "pytorch-lightning", "torchmetrics", "tabulate", "matplotlib"]
# The MlflowTracker backend + MLflow system metrics. pyobjc powers the inline IOAccelerator
# reader (Apple-Silicon GPU utilisation, no sudo) in marainer.tracking.system.
mlflow = [
    "mlflow",
    "psutil",
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]
# The TensorBoardTracker backend uses torch.utils.tensorboard, so it implies [torch].
tensorboard = ["marainer[torch]"]
# The WandbTracker backend.
wandb = ["wandb"]
# TensorFlow/Keras tracking helper (marainer.tensorflow.keras_tracking_callback).
tensorflow = ["tensorflow"]
# Everything a workspace install wants.
all = ["marainer[lightning,mlflow,tensorboard,wandb]"]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
torpaido = [
    "torpaido>=0.1.0"
]

[project.entry-points."confluid.configurables"]
# Light root: the tracking backends, run-name helper, and checkpoint policies.
marainer = "marainer"
# The four Tracker backends + TrackerGroup (import-safe; each lazily imports its library).
marainer-tracking = "marainer.tracking"
# ClassificationPredictionsSink (modality-neutral predictions sink; its own code is numpy-only,
# but it imports sampleflux for Sample types, which transitively pulls torch — so it is NOT part of
# the light-core import contract; only `import marainer` / `import marainer.tracking` stay torch-free).
marainer-sinks = "marainer.sinks"
# The Lightning platform: registers the deferred runtime members (torch optimizers / DataLoader /
# pl.Trainer) + stock Lightning loggers, and re-exports the tracking callbacks / MetricPreset. Imports
# pytorch_lightning — discovery must warn-and-continue on a light install without the [lightning] extra.
marainer-lightning = "marainer.lightning.configurables"

[tool.setuptools.packages.find]
where = ["."]
include = ["marainer*"]

[tool.setuptools.package-data]
marainer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["marainer"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "torch.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "tabulate.*",
    "matplotlib.*",
    "wandb.*",
    "tensorflow.*",
    "coolname.*"
]
ignore_missing_imports = true
