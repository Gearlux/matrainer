[project]
name = "marainer"
version = "0.1.0"
description = "Project-agnostic training and processing pipeline orchestrator."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "liquifai>=0.1.0",
    "log-flow>=0.1.0",
    "confluid>=0.1.0",
    "data-flux>=0.1.0",
    "mlflow",
    "torch",
    "numpy",
    "pytorch-lightning",
    "tensorboard",
    "torchmetrics"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
torpaido = [
    "torpaido>=0.1.0"
]

[project.scripts]
marainer = "marainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["marainer*"]

[tool.setuptools.package-data]
marainer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["marainer"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "torch.*",
    "torchmetrics.*",
    "pytorch_lightning.*"
]
ignore_missing_imports = true
