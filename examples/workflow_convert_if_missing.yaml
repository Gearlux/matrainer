# Workflow example — convert a dataset to HDF5 only if the output is not already
# on disk (the memoise-and-continue cache pattern), using the higher-order
# runnable combinators in `marainer.workflow`.
#
# Run with:  marainer process examples/workflow_convert_if_missing.yaml
#
# `Conditional` runs ONE of two runnables depending on `condition`:
#   - condition true  (mnist.h5 already exists) -> `if_true`  (here: null = skip)
#   - condition false (cache miss)              -> `if_false` (run the conversion)
# Only the selected branch's run() is ever called; wiring the branch `!lazy:`
# means an unchosen branch is never even built.
import:
  - dataflux.core
  - dataflux.sources
  - dataflux.storage.hdf5
  - marainer.processing
  - marainer.workflow

processor: !class:marainer.workflow.Conditional
  condition: !class:marainer.workflow.PathExists
    path: ./mnist.h5
  if_true: null                                   # already converted -> nothing to do
  if_false: !lazy:marainer.processing.DatasetProcessor
    show_progress: true
    flux: !class:dataflux.core.Flux
      source: !class:dataflux.sources.HuggingFaceSource
        path: mnist
        split: train
        input_feature: image
        target_feature: label
        count: 100
      ops:
        - !class:dataflux.ops.ToTensorOp
          normalize: true
    sink: !class:dataflux.storage.hdf5.HDF5Sink
      path: ./mnist.h5
