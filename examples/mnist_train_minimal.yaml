experiment_name: mnist_digits
run_name: lightning_baseline

model: !class:examples.mnist_model.MNISTSimpleCNN()
  num_classes: 10
  input_channels: 1

train_set: !class:sampleflux.core.Flux()
  source: !class:sampleflux.sources.HuggingFaceSource()
    path: mnist
    split: train
    input_feature: image
    target_feature: label
    count: 1000
  ops:
    - !class:sampleflux.ops.ToTensorOp()
      normalize: true

max_epochs: 10