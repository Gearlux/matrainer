experiment_name: mnist_digits
run_name: lightning_baseline

model: !class:examples.mnist_model.MNISTSimpleCNN()
  num_classes: 10
  input_channels: 1

optimizer: !class:torch.optim.Adam
  lr: 0.001

train_set: !class:dataflux.core.Flux()
  source: !class:dataflux.sources.HuggingFaceSource()
    path: mnist
    split: train
    input_feature: image
    target_feature: label
    count: 1000
  ops:
    - !class:dataflux.ops.ToTensorOp()
      normalize: true

train_loader: !class:torch.utils.data.DataLoader
  batch_size: 16
  num_workers: 0

lightning: !class:pytorch_lightning.Trainer
  max_epochs: 3
  accelerator: cpu
