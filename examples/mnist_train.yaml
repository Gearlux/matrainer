experiment_name: mnist_digits
run_name: lightning_baseline

model: !class:examples.mnist_model.MNISTSimpleCNN()
  num_classes: 10
  input_channels: 1

optimizer: !class:torch.optim.Adam
  lr: 0.001

# Load each HuggingFace split once. The !ref: tag lets us point to these
# from multiple DatasetSplits below — !ref: shares the same live object,
# so the HF dataset is loaded exactly once.
hf_train: !class:sampleflux.sources.HuggingFaceSource()
  path: mnist
  split: train
  input_feature: image
  target_feature: label
  count: 1000

hf_test: !class:sampleflux.sources.HuggingFaceSource()
  path: mnist
  split: test
  input_feature: image
  target_feature: label
  count: 1000

# 90/10 reproducible train/val split out of the HuggingFace train data.
train_set: !class:sampleflux.core.Flux()
  source: !class:sampleflux.sources.DatasetSplit()
    source: !ref:hf_train
    split: train
    val_fraction: 0.1
    seed: 42
  ops:
    - !class:sampleflux.ops.numpy.NormalizeOp()
      max_value: 255
    - !class:sampleflux.ops.ToTensorOp()
      normalize: false

val_set: !class:sampleflux.core.Flux()
  source: !class:sampleflux.sources.DatasetSplit()
    source: !ref:hf_train
    split: val
    val_fraction: 0.1
    seed: 42
  ops:
    - !class:sampleflux.ops.ToTensorOp()
      normalize: true

# Held-out test set — evaluated once after fit() via lightning_trainer.test().
test_set: !class:sampleflux.core.Flux()
  source: !ref:hf_test
  ops:
    - !class:sampleflux.ops.ToTensorOp()
      normalize: true

max_epochs: 3
batch_size: 16
num_workers: 0
