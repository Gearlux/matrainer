experiment_name: mnist_digits
run_name: with_metrics

# Shared parameter — broadcast to all metrics and the model
num_classes: 10

model: !class:examples.mnist_model.MNISTSimpleCNN()
  input_channels: 1

optimizer: !class:torch.optim.Adam
  lr: 0.001

# Explicit metrics list — num_classes is broadcast automatically from root.
metrics:
  - !class:torchmetrics.classification.MulticlassAccuracy()
  - !class:torchmetrics.classification.MulticlassF1Score()
      average: macro
  - !class:torchmetrics.classification.MulticlassPrecision()
  - !class:torchmetrics.classification.MulticlassRecall()

# Train / val / test MetricCollections use !clone: for independent state
# (torchmetrics requires separate state per phase).
train_metrics: !class:torchmetrics.MetricCollection()
  metrics: !clone:metrics
  prefix: "train/"

val_metrics: !class:torchmetrics.MetricCollection()
  metrics: !clone:metrics
  prefix: "val/"

test_metrics: !class:torchmetrics.MetricCollection()
  metrics: !clone:metrics
  prefix: "test/"

hf_train: !class:sampleflux.sources.HuggingFaceSource()
  path: mnist
  split: train
  input_feature: image
  target_feature: label
  count: 1000

hf_test: !class:sampleflux.sources.HuggingFaceSource()
  path: mnist
  split: test
  input_feature: image
  target_feature: label
  count: 1000

train_set: !class:sampleflux.core.Flux()
  source: !class:sampleflux.sources.DatasetSplit()
    source: !ref:hf_train
    split: train
    val_fraction: 0.1
    seed: 42
  ops:
    - !class:sampleflux.ops.numpy.NormalizeOp()
      max_value: 255
    - !class:sampleflux.ops.ToTensorOp()
      normalize: false

val_set: !class:sampleflux.core.Flux()
  source: !class:sampleflux.sources.DatasetSplit()
    source: !ref:hf_train
    split: val
    val_fraction: 0.1
    seed: 42
  ops:
    - !class:sampleflux.ops.ToTensorOp()
      normalize: true

test_set: !class:sampleflux.core.Flux()
  source: !ref:hf_test
  ops:
    - !class:sampleflux.ops.ToTensorOp()
      normalize: true

max_epochs: 3
batch_size: 16
num_workers: 0
